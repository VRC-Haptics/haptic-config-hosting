name: Validate & publish maps
on:
  push:
    branches: [main]
    paths:
      - "configs/**/*.json"      # run only when raw data changes
  workflow_dispatch:             # allow manual reruns

permissions:
  contents: write                # allow auto-commit
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install dependencies
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install python deps
        run: pip install "jsonschema>=4.18,<5" "referencing>=0.30"

      # Validate + transform
      - name: Process configs
        working-directory: ${{ github.workspace }}
        run: python scripts/process_configs.py
        
      # Package for Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
